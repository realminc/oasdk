name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SLANG_VERSION: "2026.14"
  SLANG_SHA256: "9445cf0b35332bfda055c9424e307f957ff58befb04c5b45b9f9f29894a41cf8"

jobs:
  build:
    name: Build and test
    if: github.repository == 'realminc/oasdk' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify sanitized source
        run: |
          test -f .oasdk-public-snapshot || {
            echo "::error::Public checkouts must be generated by the release snapshot tool"
            exit 1
          }
          for private_path in .agents .aws .codex .cursor .devin .vscode .zed; do
            test ! -e "$private_path" || {
              echo "::error::Private path leaked into the public snapshot: $private_path"
              exit 1
            }
          done

      - name: Verify release identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.loads(open("Cargo.toml").read())["package"]["version"])')"
          test "$CARGO_VERSION" = "$TAG_VERSION" || {
            echo "::error::Cargo.toml=$CARGO_VERSION does not match tag $TAG_VERSION"
            exit 1
          }

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || {
            echo "::error::Tag must be on main branch"
            exit 1
          }

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libasound2-dev libpipewire-0.3-dev libvulkan-dev mesa-vulkan-drivers \
            pkg-config spirv-tools cmake libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
          echo "AR=ar" >> "$GITHUB_ENV"

      - name: Install Slang
        run: |
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          printf '%s  %s\n' "$SLANG_SHA256" "$RUNNER_TEMP/slang.tar.gz" | sha256sum --check --strict
          sudo mkdir -p /opt/slang
          sudo tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C /opt/slang
          test -x /opt/slang/bin/slangc
          echo /opt/slang/bin >> "$GITHUB_PATH"

      - name: Format, lint, and test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

      - name: Build the runnable companion targets
        run: |
          cargo build --release --all-targets --locked

      - name: Package release archives
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist "bin/release" stage
          cargo build --release --examples --locked
          find target/release/examples -maxdepth 1 -type f -executable \
            -exec cp {} bin/release/ \;
          test "$(find bin/release -type f | wc -l)" -gt 0
          tar -czf "stage/oasdk-${version}-binaries.tar.gz" \
            --transform='s,^,oasdk-'"${version}"'/,' \
            --owner=0 --group=0 --numeric-owner \
            bin/release
          tar -czf "stage/oasdk-${version}-source.tar.gz" \
            --transform='s,^,oasdk-'"${version}"'/,' \
            --owner=0 --group=0 --numeric-owner \
            --exclude=./target --exclude=./dist --exclude=./stage --exclude=./bin .
          (cd stage && sha256sum *.tar.gz > "oasdk-${version}-sha256.txt")

      - name: Upload release archives
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oasdk-release-archives
          path: stage/
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.repository == 'realminc/oasdk' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oasdk-release-archives
          path: dist

      - name: Create the release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
